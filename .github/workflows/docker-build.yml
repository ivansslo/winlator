## 📋 Prerequisites (untuk Release Build)

Untuk workflow **release build**, Anda perlu menambahkan secrets:

1. **KEYSTORE_BASE64** - Base64 encoded keystore file
2. **KEYSTORE_PASSWORD** - Password keystore
3. **KEY_ALIAS** - Key alias name
4. **KEY_PASSWORD** - Key password

Untuk menambahkan keystore:
```bash
# Generate keystore (jika belum ada)
keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key

# Encode to base64
base64 release.jks > release.jks.b64
```

