name: Build Winlator (Robust Repair)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (contoh: v1.0-cph1823)'
        required: true
        default: 'fix-build'
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.4'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '26.1.10909125'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ============================================
      # STEP 1: Persiapan Environment
      # ============================================
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🧹 Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk*
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # ============================================
      # STEP 2: Setup Gradle & Wrapper
      # ============================================
      - name: 🛠️ Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: 📦 Ensure Gradle Wrapper exists
        run: |
          echo "=== Checking Gradle Wrapper ==="
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "❌ Wrapper missing, generating new one..."
            gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          else
            echo "✅ Wrapper already exists"
          fi
          
          echo "=== Fixing permissions and line endings ==="
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          
          echo "=== Verifying wrapper files ==="
          ls -la gradlew
          ls -la gradle/wrapper/

      # ============================================
      # STEP 3: Setup Android SDK & NDK
      # ============================================
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Android NDK
        run: |
          echo "Installing NDK ${{ env.ANDROID_NDK_VERSION }}..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # ============================================
      # STEP 4: Patch Konfigurasi
      # ============================================
      - name: 📝 Patch gradle.properties
        run: |
          echo "=== Updating gradle.properties ==="
          {
            echo ""
            echo "# Performance & Memory Fixes"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.daemon=false"
            echo ""
            echo "# AndroidX"
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
            echo ""
            echo "# Suppress warnings"
            echo "android.nonTransitiveRClass=false"
            echo "android.nonFinalResIds=false"
          } >> gradle.properties
          
          echo "=== Current gradle.properties ==="
          cat gradle.properties

      # ============================================
      # STEP 5: Build APK
      # ============================================
      - name: 🏗️ Build APK
        run: |
          echo "=== Starting ${{ github.event.inputs.build_type || 'debug' }} build ==="
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all
          else
            ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all
          fi

      # ============================================
      # STEP 6: Verifikasi & Rilis
      # ============================================
      - name: 🔎 Find APK Files
        id: find_apk
        run: |
          echo "=== Searching for APK files ==="
          APK_FILES=$(find . -name "*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "❌ No APK files found!"
            exit 1
          fi
          echo "✅ Found APK files:"
          echo "$APK_FILES"
          echo "apk_files<<EOF" >> $GITHUB_OUTPUT
          echo "$APK_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-apk-${{ github.run_number }}
          path: "**/*.apk"
          retention-days: 14

      - name: 🚀 Create Pre-Release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "**/*.apk"
          tag: "${{ github.event.inputs.version_tag }}-${{ github.run_number }}"
          name: "🧪 Test Build - ${{ github.event.inputs.version_tag }}"
          body: |
            ## Winlator Test Build
            
            - **Version:** ${{ github.event.inputs.version_tag }}
            - **Build Number:** #${{ github.run_number }}
            - **Type:** ${{ github.event.inputs.build_type }}
            - **Target:** arm64-v8a (CPH1823 compatible)
            
            ⚠️ Build ini adalah versi pengujian.
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}