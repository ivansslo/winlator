name: Build & Pre-Release for CPH1823 (Repaired)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag Version (contoh: v1.0.1-cph1823)'
        required: true
        default: 'cph1823-test'

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '26.1.10909125' # Versi NDK yang paling stabil untuk Winlator saat ini

jobs:
  build-and-release:
    name: Build & Publish Pre-Release
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout repository & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Install Build Dependencies (Linux)
        # Menginstal Ninja dan CMake yang dibutuhkan untuk compile C/C++ native (Wine/Turnip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 build-essential libx11-dev

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Specific Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}" "cmake;3.22.1"

      - name: 6. Konfigurasi Gradle & NDK (Mencegah OOM & Error NDK)
        # Langkah krusial: Membatasi RAM Gradle dan memberi tahu lokasi pasti NDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> local.properties
          
          # Membatasi penggunaan RAM agar GitHub Runner tidak Crash (Killed)
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

      - name: 7. Make Gradle Executable
        run: chmod +x ./gradlew

      - name: 8. Build Debug APK (Compile Process)
        # Menambahkan --stacktrace dan --info agar jika error lagi, lognya lebih jelas
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: 9. Rename APK for CPH1823
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Winlator-${{ github.event.inputs.version_tag }}-CPH1823.apk

      - name: 10. Create GitHub Pre-Release
        uses: ncipollo/release-action@v1
        if: success() # Hanya berjalan jika build sukses
        with:
          artifacts: "app/build/outputs/apk/debug/*.apk"
          tag: "${{ github.event.inputs.version_tag }}-${{ github.run_number }}"
          name: "Test Build CPH1823 - ${{ github.event.inputs.version_tag }}"
          body: |
            ## 📱 Repaired Experimental Build for CPH1823 (Oppo F9)
            - **Target Architecture:** `arm64-v8a`
            - **Status:** Pre-release / Test Build
            - **Run Number:** #${{ github.run_number }}
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}